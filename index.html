<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f4edde" />
<title>Futura Casa Experience</title>
<style>
:root{
  --cream:#f4edde;
  --cream-2:#eadfcd;
  --paper:#fffdf8;
  --paper-2:#faf6ee;
  --ink:#17120e;
  --ink-2:#554a3d;
  --muted:#9b8d78;
  --line:#decfb8;
  --orange:#df7040;
  --orange-2:#bd522b;
  --orange-soft:#f6dfcf;
  --teal:#208f8f;
  --dark:#17110d;
  --dark-2:#332015;
  --green:#2e7d32;
  --shadow:0 1px 2px rgba(23,18,14,.04),0 12px 32px rgba(23,18,14,.08);
  --lift:0 12px 32px rgba(23,18,14,.12),0 34px 90px rgba(23,18,14,.14);
  --radius:28px;
  --sidebar:300px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8f1e6,#efe4d3)}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
img{max-width:100%;display:block}
.app{
  min-height:100dvh;
  display:grid;
  grid-template-columns:var(--sidebar) 1fr;
}
.sidebar{
  position:sticky;
  top:0;
  height:100dvh;
  padding:28px 22px;
  background:rgba(255,253,248,.74);
  border-right:1px solid var(--line);
  backdrop-filter:blur(18px);
  display:flex;
  flex-direction:column;
  gap:22px;
}
.logo-card{
  padding:18px;
  border-radius:24px;
  background:#fff;
  border:1px solid #eadcca;
  box-shadow:var(--shadow);
}
.logo{height:58px;width:auto;object-fit:contain}
.nav{display:grid;gap:8px}
.nav button{
  min-height:50px;
  border-radius:16px;
  background:transparent;
  color:var(--ink-2);
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  font-weight:760;
  text-align:left;
}
.nav button.active{
  background:var(--ink);
  color:#fff;
}
.nav svg,.icon svg{width:22px;height:22px;display:block}
.side-cta{
  margin-top:auto;
  border-radius:28px;
  padding:22px;
  background:linear-gradient(135deg,var(--dark),var(--dark-2));
  color:#fff;
  box-shadow:var(--lift);
  overflow:hidden;
  position:relative;
}
.side-cta:after{
  content:"";
  position:absolute;
  width:180px;height:180px;border-radius:50%;
  right:-70px;bottom:-70px;
  background:radial-gradient(circle,rgba(223,112,64,.28),transparent 70%);
}
.side-cta h3{position:relative;margin:0 0 8px;font-family:Georgia,serif;font-size:26px;line-height:1;letter-spacing:-.04em;font-weight:500}
.side-cta p{position:relative;margin:0 0 18px;color:#d8c7ba;line-height:1.45}
.main{
  min-width:0;
  padding:32px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-bottom:24px;
}
.mobile-logo{display:none}
.title-block .eyebrow{
  margin:0 0 6px;
  color:var(--orange);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:12px;
  font-weight:900;
}
h1,h2,h3{
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:-.045em;
}
h1{margin:0;font-size:clamp(38px,5vw,72px);line-height:.95;font-weight:500}
h2{margin:0;font-size:clamp(30px,3vw,44px);line-height:1;font-weight:500}
h3{margin:0;font-size:25px;line-height:1.1;font-weight:500}
.accent{color:var(--orange);font-style:italic}
.sub{color:var(--ink-2);line-height:1.55;font-size:16px;margin:10px 0 0}
.grid{
  display:grid;
  gap:18px;
}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.pad{padding:24px}
.hero-card{
  min-height:420px;
  padding:34px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  color:#fff;
  background:
    linear-gradient(90deg,rgba(23,17,13,.96),rgba(23,17,13,.78),rgba(23,17,13,.38)),
    url("assets/solaris-hero.png") center/cover no-repeat;
}
.hero-card h2{color:#fff;font-size:clamp(40px,5vw,72px);max-width:760px}
.hero-card p{max-width:680px;color:#e7d8cb}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{
  min-height:54px;
  border-radius:999px;
  padding:0 22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:var(--orange);
  color:#fff;
  font-weight:860;
  text-decoration:none;
  white-space:nowrap;
}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:#fff}
.btn.soft{background:var(--orange-soft);color:var(--orange-2)}
.btn.full{width:100%}
.kpi{
  padding:22px;
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.kpi .label{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:900}
.kpi .value{font-size:clamp(26px,3vw,42px);font-weight:900;color:var(--ink);letter-spacing:-.04em}
.dark-card{
  background:linear-gradient(135deg,var(--dark),var(--dark-2));
  color:#fff;
  border:0;
  box-shadow:var(--lift);
}
.dark-card .sub,.dark-card .muted{color:#d6c7ba}
.dark-card h2,.dark-card h3{color:#fff}
.tile{
  padding:22px;
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:.18s ease;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.icon-badge{
  width:56px;height:56px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--orange-soft);
  color:var(--orange-2);
  margin-bottom:14px;
}
.icon-badge svg{width:28px;height:28px}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-radius:999px;
  background:var(--orange-soft);
  color:var(--orange-2);
  font-size:12px;
  letter-spacing:.05em;
  text-transform:uppercase;
  font-weight:900;
}
.chip.green{background:#e4f1e6;color:var(--green)}
.chip.dark{background:rgba(255,255,255,.12);color:#fff}
.thumb{
  height:180px;
  background:linear-gradient(135deg,#ede7dd,#cbb89d);
  position:relative;
}
.thumb.house{background:linear-gradient(135deg,#eee8dd,#c7ad91)}
.thumb.lot{background:linear-gradient(135deg,#ded3c1,#a79170)}
.thumb.market{background:linear-gradient(135deg,#eee8dd,#c9b394)}
.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.08))}
.thumb-label{
  position:absolute;
  left:16px;bottom:14px;
  border-radius:999px;
  padding:8px 12px;
  background:rgba(23,18,14,.84);
  color:#fff;
  font-size:12px;
  font-weight:900;
  z-index:1;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.card-body{padding:22px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta span{padding:8px 11px;border-radius:999px;background:#f2eadf;color:var(--ink-2);font-size:13px;font-weight:700}
.price{font-size:24px;font-weight:900;letter-spacing:-.04em}
.price.orange{color:var(--orange)}
.form-row{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;margin:18px 0}
input[type=range]{width:100%;accent-color:var(--orange)}
input[type=number],input[type=text],input[type=email],textarea,select{
  width:100%;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 14px;
  background:#fff;
  color:var(--ink);
  outline:none;
}
.sim-summary{
  display:grid;
  grid-template-columns:1fr auto;
  gap:16px;
  align-items:end;
}
.sim-summary .line{color:var(--ink-2);font-size:17px}
.sim-summary .val{font-weight:900;font-size:18px}
.sim-summary .total{font-weight:900;color:var(--ink)}
.sim-summary .total-val{font-size:26px;color:var(--orange);font-weight:900}
.big-money{
  font-family:Georgia,serif;
  font-size:clamp(46px,6vw,82px);
  line-height:.92;
  letter-spacing:-.06em;
  color:#fff;
}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.metric{
  padding:18px;
  border-radius:22px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
}
.metric .m-label{color:#b9aa9d;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
.metric .m-val{color:#fff;font-size:22px;font-weight:900;margin-top:6px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{padding:14px 8px;border-bottom:1px solid var(--line);text-align:right}
.table th:first-child,.table td:first-child{text-align:left}
.table th{text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.bottom-nav{
  display:none;
  position:fixed;
  left:0;right:0;bottom:0;
  height:82px;
  background:rgba(245,239,228,.96);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  grid-template-columns:repeat(5,1fr);
  z-index:50;
}
.bottom-nav button{
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--ink-2);
  font-size:11px;
  font-weight:800;
}
.bottom-nav button.active{color:var(--orange)}
.bottom-nav svg{width:22px;height:22px}
.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  background:var(--dark);
  color:#fff;
  padding:14px 18px;
  border-radius:18px;
  box-shadow:var(--lift);
  display:none;
  z-index:80;
}
.toast.show{display:block}
.hidden{display:none!important}
@media(max-width:980px){
  body{background:var(--cream)}
  .app{display:block;min-height:100dvh;padding-bottom:82px}
  .sidebar{display:none}
  .main{padding:0 18px 24px}
  .topbar{padding:18px 0 10px;margin-bottom:8px}
  .mobile-logo{display:block;height:44px;width:auto;object-fit:contain}
  .title-block h1{font-size:38px}
  .grid.two,.grid.three,.metrics{grid-template-columns:1fr}
  .hero-card{min-height:420px;padding:24px}
  .bottom-nav{display:grid}
  .form-row{grid-template-columns:1fr}
}
@media(min-width:981px){
  .screen-title-mobile{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo-card"><img class="logo" src="assets/futura-casa-logo.png" alt="Futura Casa"></div>
    <nav class="nav" id="desktopNav"></nav>
    <div class="side-cta">
      <h3>Venda mais com simulação.</h3>
      <p>Conduza o cliente do desejo à proposta personalizada.</p>
      <button class="btn full" onclick="go('simulador')">Abrir simulação</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <img class="mobile-logo" src="assets/futura-casa-logo.png" alt="Futura Casa">
      <div class="title-block" id="pageTitle"></div>
      <button class="btn secondary" onclick="go('lead')">Falar com consultor</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<nav class="bottom-nav" id="mobileNav"></nav>
<div id="toast" class="toast"></div>

<script>
const icons = {
home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>`,
lots:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/></svg>`,
houses:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>`,
sim:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 4-4 3 3 5-7"/></svg>`,
market:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l1 4a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3l1-4Z"/><path d="M7 14v7h10v-7"/></svg>`,
obra:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14 4 6 6"/><path d="m5 15 7-7 4 4-7 7H5v-4Z"/></svg>`,
lead:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`,
arrow:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>`,
spark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 1.7 4.3L18 9l-4.3 1.7L12 15l-1.7-4.3L6 9l4.3-1.7L12 3Z"/></svg>`
};
const lots=[
{id:'D22',name:'Quadra D · Lote 22',area:320,price:285000,tag:'Centro',note:'Lote equilibrado, prático e com excelente leitura de valor.'},
{id:'A07',name:'Quadra A · Lote 07',area:480,price:395000,tag:'Reserva',note:'Privacidade, metragem generosa e vocação para casa premium.'},
{id:'F05',name:'Quadra F · Lote 05',area:550,price:465000,tag:'Mata',note:'Terreno amplo para piscina, gourmet e paisagismo.'}
];
const houses=[
{id:'cont',name:'Casa Contemporânea',area:'140–180 m²',price:650000,tag:'Térrea',note:'Conforto, elegância e racionalidade construtiva.'},
{id:'prem',name:'Casa Premium',area:'190–260 m²',price:890000,tag:'Sobrado',note:'Presença arquitetônica, home office e setorização inteligente.'},
{id:'gourmet',name:'Gourmet Resort',area:'220–320 m²',price:1150000,tag:'Lazer',note:'Piscina, gourmet e experiência de resort no lote.'}
];
const products=[
{id:'arq',name:'Projeto Arquitetônico Completo',vendor:'Atelier Arq+',price:18500,tag:'Arquitetura'},
{id:'jardim',name:'Paisagismo Frontal + Jardim',vendor:'Verde Vida',price:12800,tag:'Paisagismo'},
{id:'piscina',name:'Piscina Vinil 6×3m + Deck',vendor:'Aqua Premium',price:47000,tag:'Lazer'}
];
const state={page:'home',lot:'D22',house:'cont',cart:['arq'],lead:{},sim:{lotEntry:15,lotMonths:180,lotRate:.85,houseEntry:20,houseMonths:240,houseRate:.95}};
function fmt(v){return 'R$ '+Math.round(v).toLocaleString('pt-BR')}
function selectedLot(){return lots.find(x=>x.id===state.lot)}
function selectedHouse(){return houses.find(x=>x.id===state.house)}
function moneyPayment(principal,rate,months){const i=rate/100;if(principal<=0)return 0;if(i===0)return principal/months;return principal*(i*Math.pow(1+i,months))/(Math.pow(1+i,months)-1)}
function calc(){const l=selectedLot(),h=selectedHouse(),s=state.sim,cartTotal=products.filter(p=>state.cart.includes(p.id)).reduce((a,p)=>a+p.price,0),lotEntry=l.price*s.lotEntry/100,houseEntry=h.price*s.houseEntry/100,lotPay=moneyPayment(l.price-lotEntry,s.lotRate,s.lotMonths),housePay=moneyPayment(h.price-houseEntry,s.houseRate,s.houseMonths),cartPay=cartTotal/12;return{l,h,cartTotal,lotEntry,houseEntry,lotPay,housePay,cartPay,phase1:lotPay,phase2:lotPay+housePay+cartPay,phase3:housePay+cartPay,total:l.price+h.price+cartTotal,entry:lotEntry+houseEntry,peak:lotPay+housePay+cartPay+23000}}
function go(page){state.page=page;render();window.scrollTo(0,0)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function setSim(k,v){state.sim[k]=Number(v);render()}
function addCart(id){if(!state.cart.includes(id))state.cart.push(id);toast('Item adicionado à simulação');render()}
function nav(){const items=[['home','Início','home'],['lotes','Lotes','lots'],['casas','Casas','houses'],['simulador','Simular','sim'],['market','Market','market']];return items.map(([p,l,i])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')">${icons[i]}<span>${l}</span></button>`).join('')}
function title(k,t){document.getElementById('pageTitle').innerHTML=`<div class="eyebrow">${k}</div><h1>${t}</h1>`}
function shell(content){document.getElementById('view').innerHTML=content;document.getElementById('desktopNav').innerHTML=nav();document.getElementById('mobileNav').innerHTML=nav()}
function home(){const x=calc();title('Futura Casa Experience','Venda lote, casa e financiamento.');shell(`<section class="hero-card card"><h2>Lote, casa e <span class="accent">desembolso</span> em um fluxo comercial.</h2><p class="sub">Uma plataforma para transformar interesse em simulação, proposta e atendimento com muito menos atrito.</p><div class="hero-actions"><button class="btn" onclick="go('simulador')">Simular agora ${icons.arrow}</button><button class="btn secondary" onclick="go('lotes')">Escolher lote</button></div></section><section class="grid three section"><div class="card kpi"><span class="label">fase 1</span><div class="value">${fmt(x.phase1)}</div><span class="muted">só lote</span></div><div class="card kpi"><span class="label">fase 2</span><div class="value">${fmt(x.phase2)}</div><span class="muted">lote + casa</span></div><div class="card kpi"><span class="label">pico</span><div class="value">${fmt(x.peak)}</div><span class="muted">com reforços</span></div></section><section class="grid three section"><button class="card tile" onclick="go('lotes')"><div><div class="icon-badge">${icons.lots}</div><h3>Escolha o lote</h3><p class="sub">Seleção orientada por perfil e orçamento.</p></div><span class="chip">começar</span></button><button class="card tile" onclick="go('casas')"><div><div class="icon-badge">${icons.houses}</div><h3>Escolha a casa</h3><p class="sub">Modelos compatíveis com o terreno.</p></div><span class="chip">planejar</span></button><button class="card tile" onclick="go('simulador')"><div><div class="icon-badge">${icons.sim}</div><h3>Simule o desembolso</h3><p class="sub">Fases, entradas, prazos e complementos.</p></div><span class="chip green">motor central</span></button></section>`)}
function lotes(){title('Escolha do lote','Escolha e simule.');shell(`<section class="grid three">${lots.map(l=>`<button class="card" style="text-align:left" onclick="state.lot='${l.id}';go('simulador')"><div class="thumb lot"><span class="thumb-label">${l.tag}</span></div><div class="card-body"><h3>${l.name}</h3><p class="sub">${l.area} m² · ${l.note}</p><div class="price orange">${fmt(l.price)}</div><div class="meta"><span>Selecionar</span><span>Simular</span></div></div></button>`).join('')}</section>`)}
function casas(){title('Modelos de casa','Escolha e simule.');shell(`<section class="grid three">${houses.map(h=>`<button class="card" style="text-align:left" onclick="state.house='${h.id}';go('simulador')"><div class="thumb house"><span class="thumb-label">${h.tag}</span></div><div class="card-body"><h3>${h.name}</h3><p class="sub">${h.area} · ${h.note}</p><div class="price orange">${fmt(h.price)}</div><div class="meta"><span>Selecionar</span><span>Simular</span></div></div></button>`).join('')}</section>`)}
function market(){title('Marketplace','Curadoria que aumenta ticket.');shell(`<section class="grid three">${products.map(p=>`<div class="card"><div class="thumb market"><span class="thumb-label">${p.tag}</span></div><div class="card-body"><div class="chip">${p.vendor}</div><h3>${p.name}</h3><div class="price">${fmt(p.price)}</div><button class="btn full" onclick="addCart('${p.id}')">Adicionar à simulação</button></div></div>`).join('')}</section><section class="card pad section dark-card"><h2>Todo item comprado aqui entra no desembolso.</h2><p class="sub">O marketplace vira alavanca comercial e não apenas uma vitrine.</p><button class="btn" onclick="go('simulador')">Ver impacto financeiro</button></section>`)}
function simulador(){const x=calc();title('Simulação de desembolso','A ferramenta de fechamento.');shell(`<section class="card pad"><div class="sim-summary"><div class="line">Lote · ${x.l.name}</div><div class="val">${fmt(x.l.price)}</div><div class="line">Casa · ${x.h.name}</div><div class="val">${fmt(x.h.price)}</div><div class="line">Complementos</div><div class="val">${fmt(x.cartTotal)}</div><div class="line total">Total apresentado</div><div class="total-val">${fmt(x.total)}</div></div><div class="hero-actions"><button class="btn secondary" onclick="go('lotes')">Trocar lote</button><button class="btn secondary" onclick="go('casas')">Trocar casa</button><button class="btn secondary" onclick="go('market')">Adicionar itens</button></div></section><section class="card pad dark-card section"><div class="eyebrow">desembolso recorrente estimado</div><div class="big-money">${fmt(x.phase2)}<span style="font:20px Inter">/mês</span></div><div class="metrics"><div class="metric"><div class="m-label">fase 1</div><div class="m-val">${fmt(x.phase1)}</div></div><div class="metric"><div class="m-label">fase 2</div><div class="m-val">${fmt(x.phase2)}</div></div><div class="metric"><div class="m-label">fase 3</div><div class="m-val">${fmt(x.phase3)}</div></div><div class="metric"><div class="m-label">pico</div><div class="m-val">${fmt(x.peak)}</div></div></div></section><section class="card pad section"><h3>Ajustes rápidos</h3>${range('lotEntry','Entrada do lote',5,50,5,'%')}${range('lotMonths','Prazo do lote',60,240,12,'meses')}${range('houseEntry','Entrada da casa',5,40,5,'%')}${range('houseMonths','Prazo da casa',120,420,12,'meses')}</section><section class="grid two section"><button class="btn full" onclick="go('lead')">Avançar para proposta</button><a class="btn secondary full" href="simulador-desembolso.html">Abrir simulador técnico completo</a></section>`)}
function range(k,label,min,max,step,suf){return `<div class="form-row"><label><b>${label}</b><br><span class="muted">${state.sim[k]} ${suf}</span></label><input type="number" min="${min}" max="${max}" step="${step}" value="${state.sim[k]}" onchange="setSim('${k}',this.value)"><input type="range" min="${min}" max="${max}" step="${step}" value="${state.sim[k]}" oninput="setSim('${k}',this.value)"></div>`}
function lead(){title('Proposta personalizada','Capture e avance.');shell(`<section class="card pad"><h2>Enviar simulação para o consultor</h2><p class="sub">O lead chega com lote, casa, fase 1, fase 2, fase 3 e complementos.</p><div class="grid two section"><input type="text" placeholder="Nome do cliente"><input type="text" placeholder="WhatsApp"><input type="email" placeholder="E-mail"><select><option>Quero reservar lote + casa</option><option>Quero apenas lote</option><option>Quero apenas casa</option></select></div><textarea rows="5" class="section" placeholder="Observações comerciais"></textarea><button class="btn full section" onclick="toast('Lead pronto para CRM/WhatsApp')">Gerar proposta e enviar</button></section>`)}
function render(){if(state.page==='home')home(); if(state.page==='lotes')lotes(); if(state.page==='casas')casas(); if(state.page==='market')market(); if(state.page==='simulador')simulador(); if(state.page==='lead')lead();}
render();
</script>
</body>
</html>
